  background-size:cover; background-position:center; background-attachment:fixed;
  color:var(--ink); font-family:'Inter',system-ui,-apple-system,sans-serif;

.hero{
  padding:2rem 1.25rem 1.6rem; text-align:center; position:relative;
}
.hero img{
  max-width:min(260px,60vw); width:100%; filter:drop-shadow(0 10px 22px rgba(0,0,0,.35));
}
main{ max-width:820px; margin:0 auto; padding:0 1.1rem 3rem; }
.panel{
  background:var(--card); border:1px solid var(--line); border-radius:16px; padding:1.25rem;
  margin-bottom:1.1rem; box-shadow:0 12px 30px rgba(5,15,50,.18);
}
.panel h2{ font-size:1.05rem; margin:0 0 .9rem; color:var(--ink); }
.row{ display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
input[type=text], input[type=number]{
  font:inherit; padding:.6rem .7rem; border-radius:9px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); flex:1; min-width:140px;
}
input[type=number]{ max-width:5.5rem; flex:none; }
button{ font:inherit; cursor:pointer; border:none; border-radius:9px; padding:.62rem 1.1rem; font-weight:700; }
.btn-primary{ background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:#3a2600; }
.btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
.teamlist{ list-style:none; margin:.9rem 0 0; padding:0; display:flex; flex-direction:column; gap:.5rem; }
.teamlist li{
  display:flex; align-items:center; gap:.65rem; background:var(--card); border:1px solid var(--line);
  border-radius:9px; padding:.5rem .65rem;
}
.teamlist .placeholder{
  width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--blue-deep));
  color:#fff; display:flex; align-items:center; justify-content:center; font-size:.72rem; font-weight:700; flex:none;
}
.teamlist span{ flex:1; font-weight:500; }
.teamlist button{ background:none; color:var(--danger); font-size:1rem; padding:.1rem .4rem; }
.empty{ color:var(--muted); font-size:.9rem; }
.settings-row{ display:flex; gap:1.4rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem;}
.settings-row label{ font-size:.9rem; color:var(--muted); display:block; margin-bottom:.25rem; }
.count{ color:var(--muted); font-size:.85rem; margin-top:.6rem; }
#drawBtn{ width:100%; font-size:1.1rem; padding:.9rem; letter-spacing:.02em; position:relative; overflow:hidden; }
#drawBtn.spinning::after{
  content:"⚽"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; background:linear-gradient(135deg,var(--gold),var(--gold-2));
  animation:spin 0.5s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
#results{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.9rem; margin-top:1.2rem; }
.group{ border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); box-shadow:0 8px 20px rgba(5,15,50,.15); }
.group h3{
  margin:0; background:linear-gradient(135deg,var(--blue-deep),var(--blue)); color:#fff; font-family:'Bebas Neue',sans-serif;
  letter-spacing:.04em; font-size:1.3rem; padding:.5rem .8rem;
}
.group ul{ list-style:none; margin:0; padding:.4rem; display:flex; flex-direction:column; gap:.35rem; }
.group li{ display:flex; align-items:center; gap:.55rem; padding:.4rem .5rem; border-radius:8px; background:rgba(15,79,201,.06); }
.slot{ font-size:.7rem; color:var(--muted); font-weight:700; width:1.6rem; flex:none; }
@keyframes reveal{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
.group{ animation:reveal .4s ease both; }
</style>
</head>

<main>
  <div class="panel">
    <h2>Teams</h2>
    <div class="row">
      <input type="text" id="nameInput" placeholder="Team name" maxlength="40">
      <button class="btn-primary" id="addBtn" type="button">Add team</button>
    </div>
    <ul class="teamlist" id="teamList"></ul>
    <div class="empty" id="emptyMsg">No teams yet — add your first one above.</div>
  </div>

  <div class="panel">
    <h2>Draw settings</h2>
    <div class="settings-row">
      <div>
        <label for="groupSize">Teams per group</label>
        <input type="number" id="groupSize" value="4" min="2" max="20">
      </div>
    </div>
    <div class="count" id="groupPreview"></div>
    <div style="margin-top:1rem;">
      <button class="btn-primary" id="drawBtn" type="button">Draw groups</button>
    </div>
  </div>

  <div id="results"></div>
</main>

<script>
const state = { teams: [] };

try {
  const saved = localStorage.getItem('futsal-teams');
  if (saved) state.teams = JSON.parse(saved);
} catch(e){ console.warn('no saved teams', e); }

const teamListEl = document.getElementById('teamList');
const emptyMsg = document.getElementById('emptyMsg');
const nameInput = document.getElementById('nameInput');
const addBtn = document.getElementById('addBtn');
const groupSizeInput = document.getElementById('groupSize');
const groupPreview = document.getElementById('groupPreview');
const drawBtn = document.getElementById('drawBtn');
const resultsEl = document.getElementById('results');

function saveTeams(){
  try{ localStorage.setItem('futsal-teams', JSON.stringify(state.teams)); }catch(e){}
}

function initials(name){
  return name.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
}

function renderTeams(){
  teamListEl.innerHTML = '';
  emptyMsg.style.display = state.teams.length ? 'none' : 'block';
  state.teams.forEach((t, i)=>{
    const li = document.createElement('li');
    const ph = document.createElement('div'); ph.className='placeholder'; ph.textContent = initials(t.name); li.appendChild(ph);
    const span = document.createElement('span'); span.textContent = t.name; li.appendChild(span);
    const rm = document.createElement('button'); rm.textContent = '✕'; rm.type='button';
    rm.onclick = ()=>{ state.teams.splice(i,1); saveTeams(); renderTeams(); updatePreview(); };
    li.appendChild(rm);
    teamListEl.appendChild(li);
  });
  updatePreview();
}

function updatePreview(){
  const size = Math.max(2, parseInt(groupSizeInput.value)||4);
  const n = state.teams.length;
  if(!n){ groupPreview.textContent=''; drawBtn.disabled = true; return; }
  const groups = Math.ceil(n/size);
  groupPreview.textContent = `${n} team${n===1?'':'s'} → ${groups} group${groups===1?'':'s'} (last group may have fewer)`;
  drawBtn.disabled = n < 2;
}

function addTeam(){
  const name = nameInput.value.trim();
  if(!name) return;
  state.teams.push({ name });
  nameInput.value = '';
  saveTeams();
  renderTeams();
  nameInput.focus();
}
addBtn.onclick = addTeam;
nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addTeam(); } });
groupSizeInput.addEventListener('input', updatePreview);

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function letterFor(i){
  let s=''; i++;
  while(i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26); }
  return s;
}

function renderGroups(){
  const size = Math.max(2, parseInt(groupSizeInput.value)||4);
  const shuffled = shuffle(state.teams);
  const groups = [];
  for(let i=0;i<shuffled.length;i+=size){ groups.push(shuffled.slice(i, i+size)); }

  resultsEl.innerHTML = '';
  groups.forEach((g, gi)=>{
    const div = document.createElement('div'); div.className='group';
    const h3 = document.createElement('h3'); h3.textContent = 'Group ' + letterFor(gi);
    div.appendChild(h3);
    const ul = document.createElement('ul');
    g.forEach((t, ti)=>{
      const li = document.createElement('li');
      const slot = document.createElement('span'); slot.className='slot'; slot.textContent = letterFor(gi)+(ti+1);
      li.appendChild(slot);
      const ph=document.createElement('div'); ph.className='placeholder'; ph.textContent=initials(t.name); li.appendChild(ph);
      const span = document.createElement('span'); span.textContent = t.name; li.appendChild(span);
      ul.appendChild(li);
    });
    div.appendChild(ul);
    resultsEl.appendChild(div);
  });
  resultsEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function draw(){
  drawBtn.disabled = true;
  drawBtn.classList.add('spinning');
  resultsEl.innerHTML = '';
  const spinDuration = 1200 + Math.floor(Math.random()*600);
  setTimeout(()=>{
    drawBtn.classList.remove('spinning');
    drawBtn.disabled = false;
    renderGroups();
  }, spinDuration);
}
drawBtn.onclick = draw;

renderTeams();
</script>
</body>
</html>
